# Unit tests for rules/fleet.rules.yml: promtool test rules rules/tests/fleet.rules.test.yml
rule_files:
  - ../fleet.rules.yml

evaluation_interval: 1m

tests:
  - name: a healthy manager raises nothing
    interval: 1m
    input_series:
      - series: 'fleet_reconcile_duration_seconds_count{job="fleet",fleet_controller="TaskController",fleet_outcome="unchanged"}'
        values: "0+60x120"
      - series: 'fleet_forge_calls_total{job="fleet",fleet_forge_host="github.com",fleet_outcome="known"}'
        values: "0+5x120"
      - series: 'fleet_inbox_depth{job="fleet"}'
        values: "0x120"
    alert_rule_test:
      - {eval_time: 110m, alertname: FleetNotReconciling, exp_alerts: []}
      - {eval_time: 110m, alertname: FleetReconcileErrors, exp_alerts: []}
      - {eval_time: 110m, alertname: FleetForgeThrottled, exp_alerts: []}
      - {eval_time: 110m, alertname: FleetForgeUnanswered, exp_alerts: []}
      - {eval_time: 110m, alertname: FleetInboxBacklog, exp_alerts: []}

  - name: a manager that stops reconciling, then stops exporting
    interval: 1m
    input_series:
      # Sweeps for 30m, flat for 30m, then no samples at all.
      - series: 'fleet_reconcile_duration_seconds_count{job="fleet",fleet_controller="TaskController",fleet_outcome="unchanged"}'
        values: "0+60x30 1800x30"
    alert_rule_test:
      - {eval_time: 30m, alertname: FleetNotReconciling, exp_alerts: []}
      - eval_time: 50m
        alertname: FleetNotReconciling
        exp_alerts: &not_reconciling
          - exp_labels: {severity: critical, job: fleet}
            exp_annotations:
              summary: "Fleet manager fleet has not reconciled for 15 minutes"
              description: "No object reconcile was recorded, or no metrics arrived. Tasks are not progressing."
              runbook_url: https://github.com/Thurbeen/agent-observability/blob/main/docs/runbook.md#fleetnotreconciling
      - {eval_time: 90m, alertname: FleetNotReconciling, exp_alerts: *not_reconciling}

  - name: reconcile errors above 5%
    interval: 1m
    input_series:
      - series: 'fleet_reconcile_duration_seconds_count{job="fleet",fleet_controller="TaskController",fleet_outcome="unchanged"}'
        values: "0+50x60"
      - series: 'fleet_reconcile_duration_seconds_count{job="fleet",fleet_controller="TaskController",fleet_outcome="error"}'
        values: "0+10x60"
    alert_rule_test:
      - eval_time: 45m
        alertname: FleetReconcileErrors
        exp_alerts:
          - exp_labels: {severity: warning, job: fleet}
            exp_annotations:
              summary: "16.67% of Fleet reconciles fail on fleet"
              description: "More than 5% of object reconciles ended in error for 15 minutes."
              runbook_url: https://github.com/Thurbeen/agent-observability/blob/main/docs/runbook.md#fleetreconcileerrors

  - name: forge throttling and a lost login
    interval: 1m
    input_series:
      - series: 'fleet_forge_calls_total{job="fleet",fleet_forge_host="github.com",fleet_outcome="throttled"}'
        values: "0+1x60"
      - series: 'fleet_forge_calls_total{job="fleet",fleet_forge_host="gitlab.example",fleet_outcome="notLoggedIn"}'
        values: "0+1x60"
    alert_rule_test:
      - eval_time: 40m
        alertname: FleetForgeThrottled
        exp_alerts:
          - exp_labels: {severity: warning, job: fleet, fleet_forge_host: github.com}
            exp_annotations:
              summary: "github.com throttles Fleet's change polls"
              description: "The forge throttled polls from fleet for 30 minutes. ChangeRequest updates are delayed."
              runbook_url: https://github.com/Thurbeen/agent-observability/blob/main/docs/runbook.md#fleetforgethrottled
      - eval_time: 40m
        alertname: FleetForgeNotLoggedIn
        exp_alerts:
          - exp_labels: {severity: critical, job: fleet, fleet_forge_host: gitlab.example}
            exp_annotations:
              summary: "Fleet cannot read changes on gitlab.example"
              description: "Change polls from fleet fail on the forge login or permissions."
              runbook_url: https://github.com/Thurbeen/agent-observability/blob/main/docs/runbook.md#fleetforgenotloggedin

  - name: failed effects and an inbox that never drains
    interval: 1m
    input_series:
      - series: 'fleet_effects_total{job="fleet",fleet_effect="spawn",fleet_outcome="failed"}'
        values: "0 0 1x58"
      - series: 'fleet_inbox_depth{job="fleet"}'
        values: "2x90"
    alert_rule_test:
      - eval_time: 10m
        alertname: FleetEffectsFailing
        exp_alerts:
          - exp_labels: {severity: warning, job: fleet, fleet_effect: spawn}
            exp_annotations:
              summary: "Fleet spawn effects fail on fleet"
              description: "At least one spawn effect failed in the last 15 minutes."
              runbook_url: https://github.com/Thurbeen/agent-observability/blob/main/docs/runbook.md#fleeteffectsfailing
      - {eval_time: 30m, alertname: FleetEffectsFailing, exp_alerts: []}
      - {eval_time: 20m, alertname: FleetInboxBacklog, exp_alerts: []}
      - eval_time: 80m
        alertname: FleetInboxBacklog
        exp_alerts:
          - exp_labels: {severity: info, job: fleet}
            exp_annotations:
              summary: "Fleet inbox entries on fleet waited for an hour"
              description: "The inbox depth stayed at 2 or more for an hour."
              runbook_url: https://github.com/Thurbeen/agent-observability/blob/main/docs/runbook.md#fleetinboxbacklog
