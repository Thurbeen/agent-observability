# Prometheus for the quick-start stack. Fleet's metrics arrive through the
# collector on the OTLP receiver, so there is nothing to scrape.
global:
  evaluation_interval: 30s

otlp:
  # job and instance come from service.namespace, service.name and
  # service.instance.id. Keep the other useful resource attributes as labels.
  promote_resource_attributes:
    - service.version
    - host.name
    - deployment.environment.name

storage:
  tsdb:
    # OTLP pushes can arrive slightly out of order.
    out_of_order_time_window: 30m

rule_files:
  - /etc/prometheus/rules/*.rules.yml
